[project]
name = "jobsignal"
version = "0.1.0"
description = "Predictive business intelligence from ATS hiring signals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "altair>=6.3,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "pandas>=2.2,<3",
    "pydantic-settings>=2.4",
    "spacy>=3.8,<4",
    "sqlalchemy>=2.0",
    "streamlit>=1.66,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: touches a real database or multiple modules"]
filterwarnings = [
  # Starlette's TestClient asks for the separate `httpx2` package; tests keep the httpx
  # already used by the scraper (no extra dependency for test tooling).
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # pytest asserts; seeded random for test data
"alembic/versions/**" = ["F401", "W291"]  # generated: op/sa always imported; blank "Revises:"
