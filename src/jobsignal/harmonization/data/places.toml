# Gazetteer for location harmonization. Aliases are lower-case and unique across ALL tables
# (countries, regions, cities, macro_regions), so every alias has exactly one meaning.
# Deliberate calls: "la" = Louisiana (Los Angeles is "los angeles"), "wa" = Washington state,
# "in" = Indiana, "ca" = California (Canada is "canada"/"can"; "CA-" prefixes are ISO codes),
# bare "new york"/"ny" = New York State (the city is "nyc"/"new york city"),
# bare "washington" = Washington State (DC needs "dc"/"d.c."), "singapore" = the city (SG).
# Bump TAXONOMY_VERSION in taxonomy.py after any change.

unresolvable.pieces = ["n/a", "na", "location", "in-person", "in person", "amer", "tbd", "various",
                       "multiple locations", "anywhere"]

[remote]
markers = ["remote-friendly", "remote friendly", "remote", "rem"]
fillers = ["in the", "from the", "in", "from", "travel-required", "travel required", "only", "-",
           "(", ")", ","]

[noise]
words = ["hq", "privy", "metro area", "hybrid", "office", "headquarters"]

